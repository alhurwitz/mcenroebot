# .pre-commit-config.yaml
# Run: uv run pre-commit install  (hook types below are installed automatically)
# Update hooks: uv run pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # MkDocs Material uses Python-tagged YAML (!!python/name:...) which is
        # safe in this controlled config but not safe-loadable by check-yaml.
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        # Like mypy below, skip one-off docs scripts (STL generators etc.) —
        # they aren't project code; lint is scoped to src/ (see CLAUDE.md).
        exclude: ^docs/
        args: [--fix]
      - id: ruff-format
        exclude: ^docs/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # mypy is scoped to src/ (see CLAUDE.md). Exclude one-off docs scripts
        # like the trimesh-based STL generator, which aren't project code.
        exclude: ^docs/
        additional_dependencies:
          - pydantic>=2.6
          - textual>=8.0
          - pydantic[mypy]
          - httpx>=0.27
          - anyio>=4.3
          - respx>=0.21
          - pytest>=8.0
          - aiosqlite>=0.20
          - tree-sitter>=0.22
          - tree-sitter-python>=0.23
          - tree-sitter-javascript>=0.23
          - tree-sitter-typescript>=0.23
        args: [--config-file=pyproject.toml]

  # Run the test suite. Lives in a `local` repo so it can call into the
  # project's uv-managed venv (pre-commit can't see our deps otherwise).
  # Stage = pre-push so commits stay fast; switch to `pre-commit` if you
  # want every commit blocked on green tests.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
