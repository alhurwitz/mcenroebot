[project]
name = "mcenroebot"
version = "0.1.0"
description = "McEnroe ping pong robot — V2 control software (aim + swing)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcenroebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
