[project]
name = "mcenroebot"
version = "0.1.0"
description = "McEnroe ping pong robot — V2 control software (aim + swing)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-pca9685>=3.4.22",
    "adafruit-circuitpython-servokit>=1.3.24",
    "numpy>=1.24",
    "opencv-python>=4.13.0.92",
    "pydantic>=2.13.4",
    "pytest-asyncio>=1.3.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
pi = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-pca9685>=3.4.22",
    "adafruit-circuitpython-servokit>=1.3.24",
    "rpi-lgpio>=0.6",
]

[dependency-groups]
dev = [
    "ipython>=9.14.1",
    "mypy==2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.14",
]
pi = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcenroebot"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["type-arg", "misc", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "aiosqlite",
    "fastembed",
    "numpy",
    "numpy.testing",
    "numpy.typing",
    "cv2",
    "anthropic", "anthropic.*",
    "openai", "openai.*",
    "trafilatura", "trafilatura.*",
    "exa_py", "exa_py.*",
    "tiktoken", "tiktoken.*",
    # Phase 2: LocalFiles backend optional deps (no type stubs available)
    "fitz", "fitz.*",
    "xxhash",
    "pathspec", "pathspec.*",
    "tree_sitter", "tree_sitter.*",
    "tree_sitter_python",
    "tree_sitter_javascript",
    "tree_sitter_typescript",
    # Phase 7: Framework adapter deps (no type stubs available)
    "langchain_core", "langchain_core.*",
    "langgraph", "langgraph.*",
    "llama_index", "llama_index.*",
    "agents", "agents.*",
    "claude_agent_sdk", "claude_agent_sdk.*",
    "pydantic_ai", "pydantic_ai.*",
    "crewai", "crewai.*",
    "autogen_agentchat", "autogen_agentchat.*",
    # Phase 8: MCP SDK and uvicorn (no type stubs in pre-commit env)
    "mcp", "mcp.*",
    "uvicorn", "uvicorn.*",
    # Pi-only Adafruit hardware libraries (installed via `uv sync --extra pi`).
    # On the dev Mac these are absent, so mypy can't resolve them — that's fine,
    # the real driver code is lazy-imported and gated.
    "adafruit_servokit",
    "adafruit_pca9685",
    "board",
    "busio",
    "RPi", "RPi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mcenroebot.langchain",
    "mcenroebot.langchain.*",
    "mcenroebot.langgraph",
    "mcenroebot.langgraph.*",
    "mcenroebot.llamaindex",
    "mcenroebot.llamaindex.*",
    "mcenroebot.openai_agents",
    "mcenroebot.openai_agents.*",
    "mcenroebot.claude_agent",
    "mcenroebot.claude_agent.*",
    "mcenroebot.pydantic_ai",
    "mcenroebot.pydantic_ai.*",
    "mcenroebot.crewai",
    "mcenroebot.crewai.*",
    "mcenroebot.autogen",
    "mcenroebot.autogen.*",
]
# Framework adapters subclass from externally-typed bases that lack stubs;
# misc/unused-ignore/no-any-return suppressed because import resolution differs by env.
disable_error_code = ["misc", "unused-ignore", "no-any-return"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
cache_dir = ".pytest_cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
tmp_path_retention_policy = "failed"
addopts = [
    "-ra", # summary for all non-passing outcomes
    "--strict-markers", # unknown @pytest.mark.* fails the run
    "--strict-config", # typos in ini options fail the run
    "--tb=short", # compact tracebacks
    "--import-mode=importlib", # modern import mode; works with src/ layout
    "--cov=mcenroebot",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
filterwarnings = [
    "error", # treat warnings as errors; add ignores below as needed
    # asyncio.run() can leave self-pipe sockets that are garbage-collected
    # asynchronously, surfacing a ResourceWarning from Python's own asyncio
    # internals (not user code).  Observed on 3.13; harmless to keep on 3.11.
    "ignore::ResourceWarning",
]
markers = [
    "unit: default — runs every push",
    "integration: env-gated, nightly",
    "perf: regression suite",
    "adapter: per-framework smoke",
]

[tool.coverage.run]
source = ["mcenroebot"]
branch = true
parallel = true                         # required for pytest-xdist + coverage combine
relative_files = true                   # stable paths across CI/local
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/__init__.py",
]

[tool.coverage.paths]
# Map installed location back to source for combined reports
source = [
    "src/mcenroebot",
    "*/site-packages/mcenroebot",
]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.", # ellipsis-only stubs
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
