[project]
name = "mcenroebot"
version = "0.1.0"
description = "McEnroe ping pong robot — V2 control software (aim + swing)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-pca9685>=3.4.22",
    "adafruit-circuitpython-servokit>=1.3.24",
    "numpy>=1.24",
    "opencv-python>=4.13.0.92",
    "pydantic>=2.13.4",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "types-pyyaml>=6.0.12.20260815",
]

[project.optional-dependencies]
pi = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-pca9685>=3.4.22",
    "adafruit-circuitpython-servokit>=1.3.24",
    "rpi-lgpio>=0.6",
]
voice = [
    "omnivoice>=0.2.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[dependency-groups]
dev = [
    "ipython>=9.14.1",
    "mypy==2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.14",
]
pi = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcenroebot"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/mcenroebot"]
exclude = ["^tests/", "^scripts/"]
# Ignore all missing third-party stubs globally.
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
cache_dir = ".pytest_cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
tmp_path_retention_policy = "failed"
addopts = [
    "-ra", # summary for all non-passing outcomes
    "--strict-markers", # unknown @pytest.mark.* fails the run
    "--strict-config", # typos in ini options fail the run
    "--tb=short", # compact tracebacks
    "--import-mode=importlib", # modern import mode; works with src/ layout
    "--cov=mcenroebot",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
filterwarnings = [
    "error", # treat warnings as errors; add ignores below as needed
    # asyncio.run() can leave self-pipe sockets that are garbage-collected
    # asynchronously, surfacing a ResourceWarning from Python's own asyncio
    # internals (not user code).  Observed on 3.13; harmless to keep on 3.11.
    "ignore::ResourceWarning",
]
markers = [
    "unit: default — runs every push",
    "integration: env-gated, nightly",
    "perf: regression suite",
    "adapter: per-framework smoke",
]

[tool.coverage.run]
source = ["mcenroebot"]
branch = true
parallel = true                         # required for pytest-xdist + coverage combine
relative_files = true                   # stable paths across CI/local
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/__init__.py",
]

[tool.coverage.paths]
# Map installed location back to source for combined reports
source = [
    "src/mcenroebot",
    "*/site-packages/mcenroebot",
]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.", # ellipsis-only stubs
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
