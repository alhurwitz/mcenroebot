# The bot's script. Data only — rewrite a line, re-bake it, no Python involved.
#
#   id      stable, becomes the cache filename ([A-Za-z0-9_-] only)
#   bucket  insult | whine | grudging_respect | self_deprecation | announce
#   ref     reference-voice key -> assets/voice/ref/<ref>.wav + .txt
#   text    what gets spoken; OmniVoice non-verbal tags are allowed:
#           [sigh] [laughter] [dissatisfaction-hnn] [surprise-ah] [question-ah]
#
# Score announcements are NOT here — scripts/bake_voice.py --scores generates
# the 0-11 x 0-11 grid programmatically.
#
# Keep buckets deep. The anti-repeat shuffle only feels alive if there's a lot
# to shuffle; a thin bucket is audibly a loop.

